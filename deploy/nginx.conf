server {
    listen 80;
    server_name _;

    # Security headers are set by the Flask app (app/__init__.py,
    # add_security_headers) - it sets a superset including CSP, Referrer-Policy,
    # Permissions-Policy and HSTS, and uses the stricter X-Frame-Options: DENY.
    # Do not add them here too: duplicates result, and conflicting
    # X-Frame-Options values (DENY vs SAMEORIGIN) can make a browser ignore the
    # header entirely. Every location proxies to Flask, so nothing is uncovered.

    # Logging
    access_log /var/log/nginx/work-tracking-access.log;
    error_log /var/log/nginx/work-tracking-error.log;

    # Max upload size
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }
}
